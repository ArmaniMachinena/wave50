# Wave50: собирает новости и данные ВОЗ каждые 10 минут и публикует зашифрованные data.enc / state.enc
# в ветку "data" (один коммит, перезаписывается). Нужен секрет репозитория WAVE50_PASSWORD.
name: collect
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - name: Unpack encrypted collector
        env:
          WAVE50_PASSWORD: ${{ secrets.WAVE50_PASSWORD }}
        run: |
          [ -n "$WAVE50_PASSWORD" ] || { echo "::error::Добавьте секрет WAVE50_PASSWORD (Settings → Secrets → Actions)"; exit 1; }
          cd src && openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:WAVE50_PASSWORD -in source.enc | tar xz collector
      - name: Previous state
        run: git clone --quiet --depth 1 --branch data "https://github.com/${GITHUB_REPOSITORY}.git" prev || mkdir -p prev
      - name: Python packages
        run: pip install --quiet cryptography
      - name: Collect
        env:
          WAVE50_PASSWORD: ${{ secrets.WAVE50_PASSWORD }}
        run: python3 src/collector/collect.py prev out
      - name: Publish to data branch
        run: |
          cd out && git init --quiet -b data && git add -A \
            && git -c user.name="wave50-bot" -c user.email="wave50-bot@users.noreply.github.com" commit --quiet -m "data $(date -u +%FT%TZ)" \
            && git push --quiet --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" data
